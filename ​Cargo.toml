[package]
name = "uesp_quantum_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "uesp_quantum_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
sha2 = "0.10"
chrono = "0.4"
pyo3 = { version = "0.20", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
target-cpu = "native" # Enables AVX2 SIMD acceleration
